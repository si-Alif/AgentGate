version: "3.8"
services:
  postgres:
    image: postgres:16-alpine
    container_name: agentgate-postgres
    environment:
      POSTGRES_DB: agentgate
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: agentgate-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  platform:
    build: { context: ., dockerfile: Dockerfile }
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports: ["3000:3000"]
    environment:
      AGENTGATE_NODE_ENV: development
      DATABASE_URL: postgresql://postgres:password@postgres:5432/agentgate
      AGENTGATE_DATABASE_URL: postgresql://postgres:password@postgres:5432/agentgate
      AGENTGATE_REDIS_URL: redis://redis:6379
      AGENTGATE_DB_POOL_MAX: "20"
      AGENTGATE_AUDIT_DB_POOL_MAX: "5"
      AGENTGATE_TRUST_PROXY_HOPS: "0"
      AGENTGATE_JWT_SECRET: ${AGENTGATE_JWT_SECRET}
      AGENTGATE_PLATFORM_ENCRYPTION_KEY: ${AGENTGATE_PLATFORM_ENCRYPTION_KEY}
      AGENTGATE_API_KEY_PEPPER: ${AGENTGATE_API_KEY_PEPPER}
      AGENTGATE_INVITATION_TOKEN_SECRET: ${AGENTGATE_INVITATION_TOKEN_SECRET}
      AGENTGATE_EMAIL_PROVIDER: console
      AGENTGATE_APP_BASE_URL: http://localhost:3000
      AGENTGATE_PASSWORD_PEPPER: ${AGENTGATE_PASSWORD_PEPPER}
      AGENTGATE_REFRESH_TOKEN_SECRET: ${AGENTGATE_REFRESH_TOKEN_SECRET}
volumes:
  postgres_data:
  redis_data:
